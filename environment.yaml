name: fast-ice
channels:
- conda-forge
- nodefaults
dependencies:
- gdal >=3.4,<3.13
- pyproj >=3.0
- rasterio >=1.3
- python >=3.8,<3.14
- pip
- pip:
  - -e .
  - -e ../normalized_product
  - segment-anything @ git+https://github.com/facebookresearch/segment-anything.git
  - opencv-python>=4.11.0.86, <5
  - pycocotools>=2.0.11, <3
  - matplotlib>=3.11.0, <4
  - onnxruntime>=1.23.2, <2
  - onnx>=1.22.0, <2
  - xarray>=2026.4.0, <2027
  - odc-stac[botocore]>=0.5.2, <0.6
  - odc-geo>=0.5.1, <0.6
  - stac-geoparquet>=0.8.0, <0.9
  - pystac>=1.14.3, <2
  - pystac-client>=0.9.0, <0.10
  - fsspec>=2026.6.0, <2027
  - shapely>=2.1.2, <3
  - aiohttp>=3.14.1, <4
  - torch>=2.10.0, <3
  - torchvision>=0.25.0, <0.26
  - ipykernel>=7.3.0, <8
  - scikit-learn>=1.9.0, <2
  - supervision>=0.29.1, <0.30
  - onnxscript>=0.7.0, <0.8
